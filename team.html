<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Listen and Draw - 조별 화면</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" style="max-width:640px;">

  <div class="notebook-header">
    <div class="spiral">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div>
      <h1 id="teamTitle" style="font-size:26px;">🖍️ Listen and Draw</h1>
      <p class="subtitle" id="roundLabel">대기 중...</p>
    </div>
    <button class="crayon-btn ghost" id="switchTeamBtn" style="font-size:12px; padding:8px 14px;">조 변경</button>
  </div>

  <!-- 1단계: 조 선택 -->
  <div id="pickerScreen">
    <div class="card" style="text-align:center;">
      <div class="card-title">우리 조를 선택하세요</div>
      <div class="team-picker" id="teamPicker"></div>
    </div>
  </div>

  <!-- 2단계: 조 이름 입력 -->
  <div id="nameScreen" style="display:none;">
    <div class="card name-step">
      <div class="card-title">조 이름을 지어주세요 (2~5글자)</div>
      <div id="chosenBadge" class="chosen-badge"></div>
      <input type="text" id="nameInput" maxlength="5" placeholder="예: 불꽃여우">
      <div>
        <button class="crayon-btn ghost" id="backToPickerBtn">← 다시 선택</button>
        <button class="crayon-btn green" id="confirmNameBtn">입장하기 →</button>
      </div>
    </div>
  </div>

  <!-- 3단계: 게임 화면 -->
  <div id="gameScreen" style="display:none;">
    <div class="phase-banner idle" id="phaseBanner">선생님 화면을 기다리고 있어요</div>

    <div class="card">
      <div class="card-title">📊 실시간 점수판</div>
      <div id="scoreboard" class="scoreboard"></div>
    </div>

    <div class="card" id="answerCard" style="display:none;">
      <div class="card-title">📖 오늘 문장은?</div>
      <p id="answerText" style="font-size:20px; font-family:'Jua',sans-serif;"></p>
    </div>

    <div class="card">
      <div class="card-title">🖌️ 우리 조 그림판</div>
      <div class="tool-row" id="toolRow">
        <span id="swatches" class="row"></span>
        <button class="crayon-btn ghost" id="eraserBtn">🧽 지우개</button>
        <button class="crayon-btn ghost" id="undoBtn">↩ 되돌리기</button>
        <button class="crayon-btn ghost" id="clearBtn">🗑 비우기</button>
      </div>
      <div class="row" style="margin-bottom:10px;">
        <span class="muted">굵기</span>
        <input type="range" min="2" max="24" value="6" id="widthRange">
      </div>
      <div class="canvas-shell" style="height:320px;">
        <canvas id="drawCanvas"></canvas>
      </div>
    </div>

    <div class="card" id="reviewCard" style="display:none;">
      <div class="card-title">🏆 다같이 비교해 봐요</div>
      <div class="teams-grid" id="reviewGrid"></div>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="sentences.js"></script>
<script src="answer-art.js"></script>
<script src="drawing.js"></script>
<script src="team.js"></script>
</body>
</html>
