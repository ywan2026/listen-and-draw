<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listen and Draw - 선생님 화면</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <div class="notebook-header">
    <div class="spiral">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div>
      <h1>🖍️ Listen and Draw <span class="muted" style="font-size:16px;">(선생님 화면)</span></h1>
      <p class="subtitle">문장을 들려주고, 제한시간을 골라 그림 대결을 시작하세요!</p>
    </div>
    <div style="text-align:right;">
      <div id="presenceBox" class="muted" style="font-family:'Jua',sans-serif;">접속한 조: 확인 중...</div>
      <button class="crayon-btn ghost" id="newGameBtn" style="margin-top:8px; font-size:13px; padding:8px 16px;">🔄 새 게임 시작 (점수 초기화)</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📒 오늘의 문장 (랜덤 순서)</div>
    <div class="sentence-grid" id="sentenceGrid"></div>

    <div style="margin-top:18px;">
      <div class="muted" id="roundLabel">SENTENCE 01 / 20</div>
      <h2 id="sentenceText" style="margin:6px 0 16px;">문장을 불러오는 중...</h2>
      <div class="row">
        <button class="crayon-btn sky" id="prevBtn">← 이전</button>
        <button class="crayon-btn sky" id="nextBtn">다음 →</button>
        <button class="crayon-btn orange" id="listenBtn">🔊 문장 듣기</button>
        <button class="crayon-btn ghost" id="stopBtn">⏹ 정지</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">⏱️ 제한시간 선택 후 그리기 시작</div>
    <div class="row space-between">
      <div class="row">
        <button class="crayon-btn green big" id="t20Btn">20초</button>
        <button class="crayon-btn green big" id="t30Btn">30초</button>
        <span class="muted" id="phaseText">문장을 듣고 난 뒤, 시간을 선택해서 라운드를 시작하세요.</span>
      </div>
      <div class="timer-badge" id="timerBadge">--</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📊 실시간 점수판</div>
    <div id="scoreboard" class="scoreboard"></div>
  </div>

  <div class="card">
    <div class="card-title">🏆 결과 공개 &amp; 별점 매기기</div>
    <p class="muted" id="revealHint">⏰ 제한시간이 끝나면 여기에 모든 조의 그림이 한 번에 공개돼요. 그림을 보고 별 1~3개로 점수를 매겨보세요!</p>
    <div class="teams-grid" id="teamsGrid"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="sentences.js"></script>
<script src="answer-art.js"></script>
<script src="drawing.js"></script>
<script src="teacher.js"></script>
</body>
</html>
